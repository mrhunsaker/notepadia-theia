name: Release Notepadia

on:
  push:
    # Build and publish a GitHub Release for version tags, e.g. `v2026.9.19`.
    # electron-builder uploads the installers and update manifests (latest.yml,
    # latest-mac.yml, latest-linux.yml) to the release, which is what
    # `electron-updater` in the installed app polls for automatic updates.
    tags:
      # Glob filter (not regex): `v` followed by a digit and anything else,
      # e.g. v2026.9.19. Quantifier syntax is avoided to keep this unambiguous.
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2026.9.19); defaults to the pushed tag"
        required: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Signing is now per-job (see the `release` job env block): Windows/Linux stay
  # unsigned always; macOS signs+notarizes only when the Apple secrets exist.

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Use Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate

      - name: Compute version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ -n "${GITHUB_REF_NAME}" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # No tag and no input: use the current UTC date (YYYY.M.D).
            VERSION="$(node scripts/set-build-version.mjs)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Create the draft release exactly once. The parallel packaging jobs
      # below only ever upload into this release, so they cannot race each
      # other on release creation (electron-builder does not retry a 422
      # "already_exists" from the GitHub API when creating a release).
      - name: Create draft GitHub release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! gh release view "v${VERSION}" --json id >/dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --draft \
              --title "Notepadia ${VERSION}" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          else
            echo "Draft release v${VERSION} already exists, reusing it"
          fi

  release:
    name: Build and publish (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: prepare
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
            targets: --win
          - platform: linux
            os: ubuntu-22.04
            targets: --linux
          - platform: macos
            os: macos-15
            targets: --mac
    # Per-job signing env. Windows/Linux are always unsigned; the macOS job
    # signs/notarizes only when the Apple Developer ID secrets are configured,
    # and stays unsigned (auto-discovery off) otherwise so it never hangs on a
    # certificate search. `CSC_IDENTITY_AUTO_DISCOVERY` becomes "true" exactly
    # when `platform == macos` AND `secrets.CSC_LINK` is set.
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'macos' && secrets.CSC_LINK != '' }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Use Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 rpm pkg-config libx11-dev libxkbfile-dev libsecret-1-dev

      - name: Verify environment
        run: yarn verify

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build extensions
        run: yarn build:extensions

      # Rebuild native modules for the Electron ABI. node-pty is deliberately
      # excluded: it ships N-API prebuilds (`.node` prebuilds compatible with the
      # Electron ABI) and its binding.gyp hard-codes SpectreMitigation, so a
      # from-source rebuild would fail with MSB8040 on windows-2022 runners.
      - name: Rebuild native modules for Electron
        run: yarn --cwd applications/electron rebuild --modules=drivelist,keytar,native-keymap,find-git-repositories

      # `build:prod` re-runs `rebuild` internally; it is a no-op here because
      # the step above already created the `.browser_modules` cache.
      - name: Build Electron application
        run: yarn --cwd applications/electron build:prod

      # The repository stays versioned 0.0.0; inject the generated build version
      # into the (disposable) checkout before packaging. `set-build-version.mjs`
      # generates it from the UTC date when no explicit version is given.
      - name: Set package version for release
        working-directory: applications/electron
        run: node ../../scripts/set-build-version.mjs package.json "${{ needs.prepare.outputs.version }}"

      - name: Package and publish (${{ matrix.platform }})
        working-directory: applications/electron
        run: npx --no-install electron-builder ${{ matrix.targets }} --publish always

      # The user has no local Mac, so every macOS build must be validated here.
      # Verifies the Info.plist, that all configured file-association extensions
      # were emitted as CFBundleDocumentTypes, and that the DMG is a valid disk
      # image. Code-signing (codesign) and Gatekeeper (spctl) assertions run
      # only when a signing secret is actually configured; unsigned builds skip
      # them.
      - name: Verify macOS artifacts
        if: runner.os == 'macOS'
        working-directory: applications/electron/dist
        run: |
          set -euo pipefail
          APP="$(find . -maxdepth 2 -name '*.app' -type d | head -n1)"
          [ -n "$APP" ] || { echo "no .app bundle found under dist/"; exit 1; }
          PLIST="$APP/Contents/Info.plist"
          plutil -lint "$PLIST"
          PLIST_XML="$(mktemp)"
          plutil -convert xml1 -o "$PLIST_XML" "$PLIST"
          for ext in txt log ini csv json xml html css js py java c cpp h rs go sh ps1 md sql yaml yml; do
            grep -q "<string>${ext}</string>" "$PLIST_XML" \
              || { echo "missing file-association extension in Info.plist: ${ext}"; exit 1; }
          done
          [ -n "$(ls *.dmg 2>/dev/null)" ] || { echo "no DMG produced"; exit 1; }
          hdiutil imageinfo "$(ls *.dmg | head -n1)" >/dev/null
          echo "Verification: Info.plist valid, $([ "${{ secrets.CSC_LINK != '' }}" = "true" ] && echo signed || echo unsigned) build OK"
          if [ "${{ secrets.CSC_LINK != '' }}" = "true" ]; then
            codesign --verify --deep --strict "$APP"
            spctl -a -vv --type execute "$APP"
          fi

      # SHA-256 checksums for every artifact, attached to both the workflow run
      # and the draft GitHub release so users can verify what they download.
      - name: Generate and publish checksums
        working-directory: applications/electron/dist
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const dir = process.cwd();
          for (const f of fs.readdirSync(dir)) {
            if (!/\.(exe|yml|blockmap|dmg|zip|AppImage|deb|rpm)$/.test(f)) continue;
            const hash = crypto.createHash('sha256').update(fs.readFileSync(path.join(dir, f))).digest('hex');
            fs.writeFileSync(path.join(dir, f + '.sha256'), hash + '  ' + f + '\n');
          }
          EOF
          VERSION="${{ needs.prepare.outputs.version }}"
          gh release upload "v${VERSION}" *.sha256 --repo "${{ github.repository }}" --clobber

      - name: Upload artifacts as workflow attachments
        uses: actions/upload-artifact@v4
        with:
          name: notepadia-${{ matrix.platform }}
          path: |
            applications/electron/dist/*.exe
            applications/electron/dist/*.yml
            applications/electron/dist/*.blockmap
            applications/electron/dist/*.dmg
            applications/electron/dist/*.zip
            applications/electron/dist/*.AppImage
            applications/electron/dist/*.deb
            applications/electron/dist/*.rpm
            applications/electron/dist/*.sha256
          if-no-files-found: error

  finalize:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [prepare, release]
    steps:
      # The matrix jobs above uploaded all installers and update manifests into
      # the draft release. Publishing it makes it visible to electron-updater,
      # which only resolves published releases. This job has no checkout, so
      # `gh` must be told the repository explicitly (otherwise it fails with
      # "not a git repository").
      - name: Publish draft release
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          gh release edit "v${VERSION}" --repo "${{ github.repository }}" --draft=false
          gh release view "v${VERSION}" --repo "${{ github.repository }}" --json name,tagName,isDraft,assets --jq '{name,tagName,isDraft,assets: [.assets[].name]}'