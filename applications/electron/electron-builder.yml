appId: org.notepadia.desktop
productName: Notepadia
asar: true

# Publishes release artifacts to GitHub Releases so `electron-updater` can serve
# automatic updates from https://github.com/mrhunsaker/notepadia-theia/releases.
# electron-builder also writes `dist/latest.yml` (the update manifest) during a
# publish build; see .github/workflows/release.yml.
publish:
  provider: github
  owner: mrhunsaker
  repo: notepadia-theia

# Native modules are already rebuilt for the Electron ABI by `theia rebuild:electron`
# (invoked from the `rebuild` script before electron-builder runs). Rebuilding them
# a second time here recompiles from source and fails on machines without Spectre-
# mitigated MSVC libraries (node-pty hard-codes SpectreMitigation in binding.gyp).
npmRebuild: false

directories:
  output: dist
  buildResources: build

files:
  - "**/*"
  - "!**/*.map"
  - "!**/test/**"
  - "!**/tests/**"

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  artifactName: "Notepadia-${version}-${arch}.${ext}"
  fileAssociations:
    - ext: txt
      name: Notepadia.TextFile
      description: Text document
    - ext: log
      name: Notepadia.LogFile
      description: Log file
    - ext: ini
      name: Notepadia.IniFile
      description: INI configuration file
    - ext: csv
      name: Notepadia.CsvFile
      description: CSV data file
    - ext: json
      name: Notepadia.JsonFile
      description: JSON file
    - ext: xml
      name: Notepadia.XmlFile
      description: XML file
    - ext: html
      name: Notepadia.HtmlFile
      description: HTML document
    - ext: css
      name: Notepadia.CssFile
      description: CSS stylesheet
    - ext: js
      name: Notepadia.JsFile
      description: JavaScript file
    - ext: py
      name: Notepadia.PyFile
      description: Python file
    - ext: java
      name: Notepadia.JavaFile
      description: Java source file
    - ext: c
      name: Notepadia.CFile
      description: C source file
    - ext: cpp
      name: Notepadia.CppFile
      description: C++ source file
    - ext: h
      name: Notepadia.HeaderFile
      description: C/C++ header file
    - ext: rs
      name: Notepadia.RustFile
      description: Rust source file
    - ext: go
      name: Notepadia.GoFile
      description: Go source file
    - ext: sh
      name: Notepadia.ShFile
      description: Shell script
    - ext: ps1
      name: Notepadia.Ps1File
      description: PowerShell script
    - ext: md
      name: Notepadia.MarkdownFile
      description: Markdown file
    - ext: sql
      name: Notepadia.SqlFile
      description: SQL file
    - ext:
        - yaml
        - yml
      name: Notepadia.YamlFile
      description: YAML file

nsis:
  oneClick: false
  # electron-updater can only apply updates for the default install directory,
  # so users cannot be offered a custom install location (auto-update caveat).
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Notepadia
  perMachine: false

portable:
  artifactName: "Notepadia-${version}-${arch}-portable.${ext}"

mac:
  icon: build/icon.icns
  # Hardened runtime + entitlements are valid and harmless on unsigned builds
  # and required the moment a Developer ID certificate is configured. The
  # entitlements files disable library validation so Electron helpers run under
  # hardened runtime.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Notarization is gated on credentials: electron-builder signs/notarizes when
  # App-signing env vars (CSC_LINK / CSC_KEY_PASSWORD) and Apple notarization
  # creds (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID) are present,
  # and skips (with a warning) when they are not.
  notarize: true
  artifactName: "Notepadia-${version}-${arch}.${ext}"
  target:
    - dmg
    - zip
  # macOS file associations -> CFBundleDocumentTypes in Info.plist, so the app
  # appears as an opener for the same text/source formats as on Windows/Linux.
  fileAssociations:
    - ext: txt
      name: Notepadia Text File
    - ext: log
      name: Notepadia Log File
    - ext: ini
      name: Notepadia INI File
    - ext: csv
      name: Notepadia CSV File
    - ext: json
      name: Notepadia JSON File
    - ext: xml
      name: Notepadia XML File
    - ext: html
      name: Notepadia HTML File
    - ext: css
      name: Notepadia CSS File
    - ext: js
      name: Notepadia JavaScript File
    - ext: py
      name: Notepadia Python File
    - ext: java
      name: Notepadia Java File
    - ext: c
      name: Notepadia C File
    - ext: cpp
      name: Notepadia C++ File
    - ext: h
      name: Notepadia Header File
    - ext: rs
      name: Notepadia Rust File
    - ext: go
      name: Notepadia Go File
    - ext: sh
      name: Notepadia Shell Script
    - ext: ps1
      name: Notepadia PowerShell File
    - ext: md
      name: Notepadia Markdown File
    - ext: sql
      name: Notepadia SQL File
    - ext:
        - yaml
        - yml
      name: Notepadia YAML File

linux:
  icon: build/icons
  target:
    - AppImage
    - rpm
    - deb
  category: Utility
  maintainer: Notepadia
  desktop:
    entry:
      Name: Notepadia
      Comment: Notepad++-style text editor
      MimeType: text/plain;text/x-script;text/x-c;text/x-c++;text/x-csrc;text/x-c++src;text/html;text/markdown;application/json;application/xml;text/x-java;text/x-python;text/x-typescript;text/x-javascript;text/x-shellscript;text/x-sql;text/yaml;text/css;
      Categories: Utility;TextEditor;
  artifactName: "Notepadia-${version}-${arch}.${ext}"
